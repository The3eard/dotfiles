theme = "transparent"   # custom: catppuccin_mocha colors with a transparent background (see ~/.config/helix/themes/transparent.toml)

[editor]
line-number = "absolute"      # absolute line numbers
mouse = true                  # click, scroll, select with the mouse
color-modes = true            # mode indicator changes color (normal/insert/select)
bufferline = "multiple"       # show open files as tabs when >1 is open
true-color = true
auto-format = true            # format on save when a formatter is available
popup-border = "all"          # framed popups: Space/g/m menus are easier to read
end-of-line-diagnostics = "hint"  # error text at the end of its line

[editor.cursor-shape]
insert = "bar"                # thin bar in insert mode, block in normal — easy to tell apart
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "version-control", "spacer", "separator", "file-name", "read-only-indicator", "file-modification-indicator"]
right = ["diagnostics", "workspace-diagnostics", "separator", "selections", "register", "separator", "position", "position-percentage", "spacer", "separator", "file-type"]
separator = ""          # thin powerline chevron (Nerd Font)
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true       # show LSP status messages
display-inlay-hints = true    # inline type hints

[editor.file-picker]
hidden = false                # show hidden files in the file picker (Space + f)

[editor.soft-wrap]
enable = true                 # wrap long lines instead of scrolling sideways

[editor.inline-diagnostics]
cursor-line = "warning"       # full diagnostic under the cursor's line

[keys.normal]
C-s = ":write"                # save, like any editor
C-q = ":quit"                 # quit; refuses if there are unsaved changes
C-z = "undo"                  # instead of suspending Helix to the background
C-p = "command_palette"       # fuzzy-search every command, showing its key
esc = ["collapse_selection", "keep_primary_selection"]  # Esc clears extra selections and cursors

[keys.insert]
C-s = ":write"                # save without leaving insert mode
C-q = ":quit"
C-z = "undo"

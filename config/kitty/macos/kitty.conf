# kitty.conf: only what differs from the defaults.
# Full reference: https://sw.kovidgoyal.net/kitty/conf/
# cmd+, opens this file · ctrl+cmd+, reloads it without restarting

# --- Font ---------------------------------------------------------------------
font_family      family="VictorMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 120%

# Ligatures everywhere except under the cursor, so `=>`, `!=`… stay editable
disable_ligatures cursor
undercurl_style   thick-sparse

# --- Cursor -------------------------------------------------------------------
# Keep the block cursor at the prompt too (shell integration switches it to a beam)
shell_integration no-cursor
cursor_blink_interval 0.6 ease-in-out
cursor_trail          3

# --- Window -------------------------------------------------------------------
background_opacity 0.85
background_blur    20
window_padding_width 6 10
macos_titlebar_color background

# --- Tab bar ------------------------------------------------------------------
tab_bar_align left
# Coloured blocks with faded edges; colours live in the *-theme.auto.conf files
tab_bar_style        fade
# Titles come from tab_bar.py; bell in red (ANSI slot, follows the theme)
tab_title_template   "{fmt.fg.color1}{bell_symbol}{activity_symbol}{fmt.fg.tab}{secure_input_symbol}{tab.last_focused_progress_percent}{custom}"
tab_title_max_length 36
# <outer> <inner> in pts: outer is window edge to bar, inner is bar to terminal
tab_bar_margin_height 0 4
# Same left/right inset as window_padding_width, so the tabs line up with the text
tab_bar_margin_width  10

# --- Splits -------------------------------------------------------------------
# New windows split the active one along its longer side; stack zooms one window
enabled_layouts splits:split_axis=auto, stack
inactive_text_alpha 0.5
window_border_width 1pt

# --- Behaviour ----------------------------------------------------------------
copy_on_select      clipboard
scrollback_lines    20000
notify_on_cmd_finish unfocused 10.0
editor              /opt/homebrew/bin/hx

# Remote control for `kitten @` (kitty-panes skill); listen_on needs a restart
allow_remote_control socket-only
listen_on            unix:/tmp/kitty-{kitty_pid}

# --- Shortcuts ----------------------------------------------------------------
map cmd+shift+p command_palette
map cmd+shift+r layout_action rotate
# Claude Code's fullscreen TUI grabs the mouse, so a plain click never reaches a link
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
